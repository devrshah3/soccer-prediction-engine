# Render runs ONLY the API. The Next.js frontend is deployed on Vercel - see DEPLOY.md.
services:
  - type: web
    name: soccer-prediction-api
    runtime: python
    plan: free
    region: oregon
    branch: master
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python scripts/build_deploy.py"
    startCommand: "uvicorn kickcast_api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Fixed values (not prompted for):
      - key: APP_ENV
        value: production
      - key: ENABLE_API_FOOTBALL
        value: "false" # API-Football's terms give no licence to publish its data publicly - see DEPLOY.md
      - key: ENABLE_ESPN
        value: "true" # keyless source for recent results/scorers/cards (the Nations League has no other) - undocumented, no published terms: see DEPLOY.md
      # KICKCAST_DB_PATH is left unset - defaults to <repo>/data/kickcast.db, which the build step
      # already wrote.

      # Prompted for at Blueprint creation. Every one may be left blank except where noted -
      # see .env.example for what each unlocks.
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel URL, e.g. https://soccer-prediction-engine.vercel.app (no trailing slash)
      - key: FOOTBALL_DATA_ORG_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      # Render can't prompt for and generate the same variable, so this one is created for you.
      - key: ADMIN_TOKEN
        generateValue: true
