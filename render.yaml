services:
  - type: web
    name: kickcast-api
    runtime: python
    plan: free
    region: oregon
    branch: master
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python scripts/build_deploy.py"
    startCommand: "uvicorn kickcast_api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false # set to the deployed kickcast-web URL, e.g. https://kickcast-web.onrender.com
      # KICKCAST_DB_PATH is left unset - defaults to <repo>/data/kickcast.db, which the
      # build step already wrote. Every key below is optional - see .env.example for what each one unlocks. Leave
      # unset to run entirely on free, keyless data sources.
      - key: FOOTBALL_DATA_ORG_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ENABLE_API_FOOTBALL
        value: "false" # API-Football's terms give no licence to publish its data publicly - see DEPLOY.md

  - type: web
    name: kickcast-web
    runtime: node
    plan: free
    region: oregon
    branch: master
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start -- --port $PORT"
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to the deployed kickcast-api URL, e.g. https://kickcast-api.onrender.com
