[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "global-soccer-prediction-engine"
version = "0.3.5"
description = "Time-safe soccer match, scoreline, and award prediction platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dev Shah"}]
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=17,<22",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "types-PyYAML>=6",
]
explain = ["shap>=0.46,<1"]
boosting = ["xgboost>=2.1,<4"]

[project.scripts]
soccer-engine = "soccer_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/soccer_engine/sample_data" = "soccer_engine/sample_data"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
