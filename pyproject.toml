[project]
name = "kickcast"
version = "0.1.0"
license = { text = "MIT" }
description = "Soccer match prediction engine: xG-informed Dixon-Coles with walk-forward evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy", "scipy", "requests",
    "fastapi", "uvicorn", "sqlalchemy", "apscheduler", "python-dotenv",
    "google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "penaltyblog", "httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "kickcast_engine", "kickcast_engine.models", "kickcast_engine.data",
    "kickcast_api", "kickcast_api.routes", "kickcast_api.assistant", "kickcast_api.live",
]

[tool.ruff]
line-length = 110

[tool.mypy]
explicit_package_bases = true
mypy_path = "."

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as an argument default is the documented, idiomatic pattern,
# not the "mutable default" footgun this rule exists for.
ignore = ["B008"]
