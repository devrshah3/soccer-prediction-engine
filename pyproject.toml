[project]
name = "kickcast"
version = "0.1.0"
description = "Soccer match prediction engine: xG-informed Dixon-Coles with walk-forward evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "requests"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "penaltyblog"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kickcast_engine", "kickcast_engine.models", "kickcast_engine.data"]

[tool.ruff]
line-length = 110
